<!-- Button to trigger modal -->
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addStudentModal">
  Add Student
</button>

<!-- Modal -->
<div class="modal fade" id="addStudentModal" tabindex="-1" aria-labelledby="addStudentModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content p-3">
      <div class="modal-header">
        <h5 class="modal-title" id="addStudentModalLabel">Add New Student</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form (ngSubmit)="onSubmit()" #studentForm="ngForm">
        <div class="modal-body row g-3">

          <div class="col-md-6">
            <label>Name</label>
            <input type="text" class="form-control" name="name" ngModel required />
          </div>

          <div class="col-md-6">
            <label>Father's Name</label>
            <input type="text" class="form-control" name="fatherName" ngModel required />
          </div>

          <div class="col-md-6">
            <label>Admission Number</label>
            <input type="text" class="form-control" name="admissionNumber" ngModel required />
          </div>

          <div class="col-md-6">
            <label>Class Admitted In</label>
            <input type="text" class="form-control" name="classAdmitted" ngModel required />
          </div>

          <div class="col-md-6">
            <label>Date of Admission</label>
            <input type="date" class="form-control" name="admissionDate" ngModel required />
          </div>

          <div class="col-md-6">
            <label>Current Class</label>
            <input type="text" class="form-control" name="currentClass" ngModel required />
          </div>

          <div class="col-md-6">
            <label>Date of Birth</label>
            <input type="date" class="form-control" name="dob" ngModel required />
          </div>

<div class="col-md-6">
  <label>Photo121</label>

  <!-- Camera preview (hidden until opened) -->
  <div *ngIf="showCamera" class="mt-2">
    <video #videoElement autoplay playsinline 
           style="width:100%; max-height:220px; border-radius:8px; background:#000;"></video>
    <div class="d-flex gap-2 mt-2">
      <button type="button" class="btn btn-success btn-sm" (click)="capturePhoto()">📸 Capture</button>
      <button type="button" class="btn btn-secondary btn-sm" (click)="closeCamera()">Cancel</button>
    </div>
  </div>

  <!-- Preview after capture -->
  <div *ngIf="photoPreview && !showCamera" class="mt-2">
    <img [src]="photoPreview" alt="Preview"
         style="width:100px; height:100px; object-fit:cover; border-radius:8px; border:1px solid #ccc;" />
    <div class="mt-1">
      <button type="button" class="btn btn-sm btn-outline-danger" (click)="removePhoto()">Remove</button>
    </div>
  </div>

  <!-- Open Camera Button -->
  <button *ngIf="!showCamera && !photoPreview"
          type="button" class="btn btn-outline-secondary mt-1" (click)="openCamera()">
    📷 Open Camera
  </button>

  <!-- Hidden canvas for snapshot -->
  <canvas #canvasElement style="display:none;"></canvas>
</div>
          <div class="col-12">
            <label>Address</label>
            <textarea class="form-control" name="address" rows="2" ngModel required></textarea>
          </div>

        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-success" [disabled]="!studentForm.form.valid">Submit</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </form>
    </div>
  </div>
</div>
